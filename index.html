<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shawn's Extra Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #14102b; color: #fff; overflow: hidden;
    font-family: 'Press Start 2P', monospace; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; }
  canvas { width: min(96vw, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9;
    image-rendering: pixelated; image-rendering: crisp-edges; border: 4px solid #fff; background: #000; }
  #pad { display: flex; gap: 14px; width: min(96vw, 640px); justify-content: space-between; }
  .btn { flex: 1; padding: 16px 0; font: inherit; font-size: 14px; color: #fff; background: #4b3fa8;
    border: 4px solid #fff; border-radius: 0; box-shadow: 0 4px 0 #000; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; background: #6a5de0; }
  #jump { flex: 1.6; background: #d1344f; }
  @media (hover: hover) and (pointer: fine) { #pad { display: none; } }

  #ov { position: fixed; inset: 0; background: rgba(10, 6, 30, .88); display: flex; align-items: center;
    justify-content: center; z-index: 10; padding: 12px; box-sizing: border-box; }
  #ov[hidden] { display: none; }
  .paper { background: #fff6d6; color: #2b1b3e; border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #000;
    max-width: 540px; width: 100%; max-height: 92vh; overflow: auto; padding: 18px; box-sizing: border-box;
    font-family: 'VT323', monospace; font-size: 24px; line-height: 1.15; -webkit-user-select: text; user-select: text; }
  .paper h2 { font-family: 'Press Start 2P', monospace; font-size: 12px; line-height: 1.5; margin: 0 0 12px; color: #d1344f; }
  .paper p { margin: 0 0 10px; }
  #ovPhotos { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 14px 0; }
  .polaroid { background: #fff; padding: 6px 6px 16px; border: 2px solid #000; transform: rotate(-3deg);
    width: calc(33% - 14px); min-width: 96px; box-sizing: border-box; box-shadow: 3px 3px 0 #000; }
  .polaroid:nth-child(even) { transform: rotate(3deg); }
  .polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  #ovSign { font-family: 'Press Start 2P', monospace; font-size: 9px; text-align: right; color: #d1344f; margin: 8px 0 14px; }
  #ovClose { display: block; margin: 0 auto; flex: none; padding: 12px 18px; font-size: 11px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="225"></canvas>
  <div id="pad">
    <button class="btn" id="left">&#9664;</button>
    <button class="btn" id="right">&#9654;</button>
    <button class="btn" id="jump">JUMP</button>
  </div>
</div>

<div id="ov" hidden>
  <div class="paper">
    <h2 id="ovTitle"></h2>
    <div id="ovBody"></div>
    <div id="ovPhotos"></div>
    <div id="ovSign"></div>
    <button class="btn" id="ovClose">CLOSE</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
